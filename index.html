<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>具身智能作品集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<meta name="description" content="具身智能作品集：VLA 训练部署、online RL、力位混合控制、世界模型与 Loco-Manipulation 的真机演示视频。">
<meta property="og:type" content="website">
<meta property="og:title" content="具身智能作品集">
<meta property="og:description" content="简历与真机演示视频逐条对照：叠衣服 / 折纸盒 / 套柱 / 力控任务 / PointFlow / Loco-Manipulation。">
<meta property="og:url" content="https://madokamoon.github.io/portfolio/">
<meta property="og:image" content="https://madokamoon.github.io/portfolio/preview.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#0a0d13;
    --panel-soft:#0d1420;
    --stroke:#1f2a3b;
    --stroke-soft:#18212f;
    --text:#e9eef7;
    --muted:#8b9ab1;
    --muted-dim:#63718a;
    --shadow:0 18px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}

  /* 顶栏 */
  .topbar{
    height:54px;display:flex;align-items:center;gap:16px;padding:0 20px;
    border-bottom:1px solid var(--stroke);
    background:linear-gradient(180deg,rgba(17,24,38,.96),rgba(13,20,32,.86));
    backdrop-filter:blur(12px);position:relative;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:none}
  .brand h1{font-size:15px;margin:0;letter-spacing:.4px;font-weight:600}
  .brand .pip{width:8px;height:8px;border-radius:50%;background:#ffb454;box-shadow:0 0 12px rgba(255,180,84,.8)}
  .tools{display:flex;align-items:center;gap:8px}
  .jumpbar{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 4px}
  .jumpbar::-webkit-scrollbar{display:none}
  .jump{
    flex:none;display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.02);
    font-size:12px;color:var(--muted);white-space:nowrap;transition:.16s ease;
  }
  .jump:hover{color:var(--text);border-color:#31425c;transform:translateY(-1px)}
  .jump.active{color:#0a0f18;background:#ffb454;border-color:#ffb454;font-weight:600}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.02);font-size:12px;color:var(--muted);
    transition:.16s ease;text-decoration:none;
  }
  .btn:hover{color:var(--text);border-color:#31425c}
  .btn.off{opacity:.5}

  /* 两栏 */
  main{height:calc(100% - 54px);display:grid;grid-template-columns:minmax(400px,43%) 1fr}
  .left{
    position:relative;border-right:1px solid var(--stroke-soft);
    padding:20px 20px 14px 22px;display:flex;flex-direction:column;overflow:hidden;
  }
  .page-scroll{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;scrollbar-width:thin;padding-right:30px}
  .page-scroll::-webkit-scrollbar{width:8px;height:8px}
  .page-scroll::-webkit-scrollbar-thumb{background:#243044;border-radius:8px}
  .page{position:relative;flex:none;border-radius:6px;background:#fff;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.10)}
  .page img{display:block;width:100%;height:100%;border-radius:6px}
  .left-foot{margin-top:10px;font-size:11.5px;color:var(--muted-dim)}
  .left-foot kbd{
    font-family:inherit;font-size:10.5px;background:rgba(255,255,255,.06);
    border:1px solid var(--stroke);border-radius:5px;padding:1px 5px;color:var(--muted);
  }

  /* 简历上的高亮 */
  .hot{
    position:absolute;border-radius:4px;
    background:color-mix(in srgb, var(--c) 24%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 62%, transparent);
    transition:background .15s ease, box-shadow .15s ease;
  }
  .hot.key{
    background:color-mix(in srgb, var(--c) 58%, transparent);
    box-shadow:inset 0 0 0 2px var(--c), 0 0 0 2px color-mix(in srgb, var(--c) 16%, transparent);
  }
  .hot:hover,.hot.active{background:color-mix(in srgb, var(--c) 74%, transparent);box-shadow:inset 0 0 0 2px var(--c)}
  .hot.dim{background:color-mix(in srgb, var(--c) 12%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent)}

  /* 右侧：文字 + 素材 */
  .right{overflow-y:auto;overflow-x:hidden;position:relative}
  .right::-webkit-scrollbar{width:10px}
  .right::-webkit-scrollbar-thumb{background:#243044;border-radius:8px;border:3px solid var(--bg)}
  .right-inner{padding:22px 30px 240px 30px;display:flex;flex-direction:column;gap:16px}

  .card{
    border:1px solid var(--stroke-soft);border-radius:12px;background:var(--panel-soft);
    overflow:hidden;transition:border-color .2s ease, opacity .2s ease;
    scroll-margin-top:70px;
  }
  .card.hl,.card.active{border-color:color-mix(in srgb, var(--c) 45%, transparent)}
  .card.dim{opacity:.55}
  .chead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--stroke-soft)}
  .chead .cd{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .chead .cl{font-size:13px;font-weight:600;letter-spacing:.3px}
  .media + .media{border-top:1px solid var(--stroke-soft)}
  .card[data-kind="image"] .media{cursor:pointer}
  .card[data-kind="image"] .media img{width:100%;height:auto;display:block;background:#070a10}

  /* 播放器 */
  .player{position:relative;background:#000;line-height:0}
  .player video{width:100%;height:auto;display:block;background:#000;cursor:pointer}
  .ctl{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel-soft);border-top:1px solid var(--stroke-soft);line-height:1}
  .ctl button{
    width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;
    border:1px solid var(--stroke);color:var(--muted);font-size:11px;transition:.15s ease;
  }
  .ctl button:hover{color:var(--text);border-color:#31425c;background:rgba(255,255,255,.05)}
  .ctl .time{font-size:11px;color:var(--muted-dim);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:86px;text-align:right}
  .bar{position:relative;flex:1;height:6px;border-radius:6px;background:#26313f;cursor:pointer;touch-action:none}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--c);opacity:.85}
  .bar .knob{
    position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);opacity:0;transition:opacity .15s ease;pointer-events:none;
  }
  .bar:hover .knob,.bar.drag .knob,.bar:focus-visible .knob{opacity:1}
  .bar:focus-visible{outline:1px solid color-mix(in srgb, var(--c) 60%, transparent);outline-offset:3px}

  /* 连线 */
  #lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
  #lines.hidden{display:none}
  #lines path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  #lines .main{stroke:var(--c);opacity:.72;stroke-width:1.6}
  #lines .dot{fill:var(--c);opacity:.9}
  #lines g.clipped .main{stroke-dasharray:4 5;opacity:.22}
  #lines g.on .main{opacity:1;stroke-width:2.4}
  #lines g.on .dot{r:4.4}

  /* 图片大图 */
  .lb{
    position:fixed;inset:0;z-index:80;display:none;background:rgba(4,7,12,.86);
    backdrop-filter:blur(14px);align-items:center;justify-content:center;padding:40px 66px;
  }
  .lb.open{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb .stage{max-width:min(1500px,92vw);display:flex;flex-direction:column;gap:10px}
  .lb img{max-width:100%;max-height:78vh;border-radius:12px;display:block;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.7)}
  .lb .cap{font-size:13px;color:#dbe4f2}
  .lb .nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:17px}
  .lb .nav:hover{background:rgba(255,255,255,.16)}
  .lb .prev{left:16px}.lb .next{right:16px}
  .lb .close{position:fixed;top:18px;right:20px;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:15px}
  .lb .close:hover{background:rgba(255,255,255,.16)}

  @media (max-width:1080px){ main{grid-template-columns:minmax(320px,50%) 1fr} }
  @media (max-width:860px){
    body{overflow:auto}
    main{display:block;height:auto}
    .left{position:sticky;top:0;z-index:34;height:54vh;border-right:0;border-bottom:1px solid var(--stroke)}
    .right{height:auto;overflow:visible}
    .right-inner{padding:18px 16px 80px}
    #lines{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="pip"></span><h1>具身智能作品集</h1></div>
  <nav class="jumpbar" id="jumpbar"></nav>
  <a class="btn" href="assets/简历.pdf" target="_blank" rel="noopener">简历 PDF ↗</a>
</header>

<main>
  <section class="left">
    <div class="page-scroll" id="pageScroll">
      <div class="page" id="page"><img id="pageImg" src="assets/page1.png" alt="简历"></div>
    </div>
    <div class="left-foot"><kbd>Esc</kbd> 复位</div>
  </section>
  <section class="right" id="right"><div class="right-inner" id="rightInner"></div></section>
</main>

<svg id="lines" aria-hidden="true"></svg>

<div class="lb" id="lb">
  <button class="close" id="lbClose">✕</button>
  <button class="nav prev" id="lbPrev">‹</button>
  <button class="nav next" id="lbNext">›</button>
  <div class="stage">
    <div id="lbMedia"></div>
    <div class="cap" id="lbCap"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
(function () {
  "use strict";
  var items = (window.DASHBOARD && window.DASHBOARD.items) || [];
  /* 这 8 个视频对应的文字在左侧更显眼，并在顶部给出快捷按钮 */
  var KEY_LABELS = ["叠衣服", "折纸盒", "套柱", "插入插座", "擦黑板", "削黄瓜", "PointFlow", "Loco-Manipulation"];
  var state = { active: null, hover: null };
  var page = document.getElementById("page");
  var pageScroll = document.getElementById("pageScroll");
  var pageImg = document.getElementById("pageImg");
  var right = document.getElementById("right");
  var rightInner = document.getElementById("rightInner");
  var svg = document.getElementById("lines");
  var RATIO = 0.7071;

  function pct(v) { return (v * 100).toFixed(3) + "%"; }
  function enc(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  /* ── 1. 简历上的文字高亮 ── */
  items.forEach(function (it) {
    var a = it.anchor;
    var isKey = KEY_LABELS.indexOf(it.label) >= 0;
    var hot = el("button", "hot" + (isKey ? " key" : ""));
    hot.dataset.i = it.n;
    hot.style.setProperty("--c", it.color);
    hot.style.left = "calc(" + pct(a.fx0) + " - 4px)";
    hot.style.top = "calc(" + pct(a.fy0) + " - 4px)";
    hot.style.width = "calc(" + pct(a.fx1 - a.fx0) + " + 8px)";
    hot.style.height = "calc(" + pct(a.fy1 - a.fy0) + " + 8px)";
    hot.title = it.label;
    hot.setAttribute("aria-label", "简历文字 " + it.label + "，跳到对应素材");
    hot.addEventListener("click", function () { activate(it.n, true); });
    hot.addEventListener("mouseenter", function () { state.hover = it.n; paint(); });
    hot.addEventListener("mouseleave", function () { if (state.hover === it.n) state.hover = null; paint(); });
    page.appendChild(hot);
  });

  /* ── 1b. 顶部快捷按钮 ── */
  var jumpbar = document.getElementById("jumpbar");
  KEY_LABELS.forEach(function (label) {
    var it = items.filter(function (x) { return x.label === label; })[0];
    if (!it) return;
    var b = el("button", "jump", label);
    b.dataset.n = it.n;
    b.style.setProperty("--c", it.color);
    b.title = "跳到「" + label + "」对应素材";
    b.addEventListener("click", function () { activate(it.n, true, true); });
    jumpbar.appendChild(b);
  });

  /* ── 2. 右侧：一行文字一张素材 ── */
  var images = [];          // 供大图浏览
  function fmt(s) {
    if (!isFinite(s) || s < 0) return "--:--";
    var m = Math.floor(s / 60), x = Math.floor(s % 60);
    if (m >= 60) return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + ":" + String(x).padStart(2, "0");
    return m + ":" + String(x).padStart(2, "0");
  }
  function pauseOthers(cur) {
    document.querySelectorAll(".player video").forEach(function (o) {
      if (o !== cur && !o.paused) o.pause();
    });
  }
  var io = window.IntersectionObserver ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var v = en.target;
      io.unobserve(v);
      if (v.readyState === 0 && v.paused) { v.preload = "metadata"; v.load(); }
    });
  }, { root: right, rootMargin: "500px 0px" }) : null;
  function lazyMeta(v) { if (io) io.observe(v); else { v.preload = "metadata"; v.load(); } }

  function makeControls(v, card) {
    var ctl = el("div", "ctl");
    var pp = el("button", "pp", "▶");
    pp.title = "播放 / 暂停";
    pp.setAttribute("aria-label", "播放 / 暂停");
    var bar = el("div", "bar");
    var fill = el("div", "fill");
    var knob = el("div", "knob");
    bar.appendChild(fill); bar.appendChild(knob);
    bar.tabIndex = 0;
    bar.setAttribute("role", "slider");
    bar.setAttribute("aria-label", "播放进度");
    var time = el("span", "time", "0:00 / --:--");
    ctl.appendChild(pp); ctl.appendChild(bar); ctl.appendChild(time);

    function toggle() {
      if (v.paused) { pauseOthers(v); var p = v.play(); if (p && p.catch) p.catch(function () {}); }
      else v.pause();
    }
    pp.addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
    v.addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
    v.addEventListener("play", function () { pp.textContent = "⏸"; card.classList.add("playing"); });
    v.addEventListener("pause", function () { pp.textContent = "▶"; card.classList.remove("playing"); });
    v.addEventListener("ended", function () { pp.textContent = "▶"; card.classList.remove("playing"); });

    function sync() {
      var d = v.duration, ok = isFinite(d) && d > 0;
      var p = ok ? (v.currentTime / d) * 100 : 0;
      fill.style.width = p.toFixed(3) + "%";
      knob.style.left = p.toFixed(3) + "%";
      time.textContent = fmt(v.currentTime) + " / " + (ok ? fmt(d) : "--:--");
    }
    v.addEventListener("timeupdate", function () { if (!dragging) sync(); });
    ["loadedmetadata", "durationchange", "progress", "seeked"].forEach(function (ev) {
      v.addEventListener(ev, function () { if (!dragging) sync(); });
    });

    var dragging = false;
    function seekAt(clientX) {
      var r = bar.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (clientX - r.left) / Math.max(1, r.width)));
      var d = v.duration, ok = isFinite(d) && d > 0;
      if (ok) v.currentTime = ratio * d;
      fill.style.width = (ratio * 100).toFixed(3) + "%";
      knob.style.left = (ratio * 100).toFixed(3) + "%";
      time.textContent = fmt(ok ? ratio * d : 0) + " / " + (ok ? fmt(d) : "--:--");
    }
    bar.addEventListener("pointerdown", function (e) {
      e.preventDefault(); e.stopPropagation();
      dragging = true; bar.classList.add("drag");
      try { if (bar.setPointerCapture && e.pointerId != null) bar.setPointerCapture(e.pointerId); } catch (err) {}
      seekAt(e.clientX);
    });
    bar.addEventListener("pointermove", function (e) { if (dragging) seekAt(e.clientX); });
    function endDrag() { if (!dragging) return; dragging = false; bar.classList.remove("drag"); sync(); }
    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);
    bar.addEventListener("keydown", function (e) {
      if (!v.duration || !isFinite(v.duration)) return;
      if (e.key === "ArrowRight") { v.currentTime = Math.min(v.duration, v.currentTime + 5); e.preventDefault(); }
      if (e.key === "ArrowLeft") { v.currentTime = Math.max(0, v.currentTime - 5); e.preventDefault(); }
    });
    return ctl;
  }

  items.forEach(function (it) {
    var card = el("article", "card");
    card.dataset.n = it.n;
    card.id = "item-" + it.n;        // 供 PDF 里的「在线播放」直接跳转
    card.dataset.kind = it.media[0].kind;
    card.style.setProperty("--c", it.color);
    var head = el("div", "chead");
    head.appendChild(el("span", "cd"));
    head.appendChild(el("span", "cl", it.label));
    card.appendChild(head);

    it.media.forEach(function (m, mi) {
      var box = el("div", "media");
      if (m.kind === "video") {
        var player = el("div", "player");
        var v = el("video");
        v.muted = true; v.defaultMuted = true; v.volume = 0; v.playsInline = true; v.preload = "none";
        v.loop = true;                                        // 播放完自动循环
        v.setAttribute("muted", "");
        if (m.w && m.h) { v.width = m.w; v.height = m.h; }   // 预占位，避免懒加载后布局跳动
        v.poster = enc(m.cover);
        v.src = enc(m.src);
        player.appendChild(v);
        player.appendChild(makeControls(v, card));
        // 鼠标移入自动播放（从上次位置继续），移出暂停，进度保留
        player.addEventListener("mouseenter", function () {
          pauseOthers(v);
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
        });
        player.addEventListener("mouseleave", function () { v.pause(); });
        box.appendChild(player);
        lazyMeta(v);
      } else {
        var img = el("img");
        img.loading = "lazy";
        if (m.w && m.h) { img.width = m.w; img.height = m.h; }
        img.src = enc(m.cover);
        img.alt = it.label;
        box.appendChild(img);
        var gi = images.length;
        images.push({ n: it.n, src: m.src, label: it.label });
        box.addEventListener("click", function () { openLightbox(gi); });
      }
      card.appendChild(box);
    });

    card.addEventListener("mouseenter", function () { state.hover = it.n; paint(); });
    card.addEventListener("mouseleave", function () { if (state.hover === it.n) state.hover = null; paint(); });
    head.addEventListener("click", function () { activate(it.n, false, true); });
    rightInner.appendChild(card);
  });

  /* ── 3. 选中 / 跳转 ── */
  var programmaticUntil = 0;
  function activate(n, scrollRight, syncLeft) {
    state.active = n;
    document.querySelectorAll(".hot").forEach(function (h) {
      var on = +h.dataset.i === n;
      h.classList.toggle("active", on);
      h.classList.toggle("dim", n != null && !on);
    });
    document.querySelectorAll(".card").forEach(function (c) {
      var on = +c.dataset.n === n;
      c.classList.toggle("active", on);
    });
    document.querySelectorAll(".jump").forEach(function (b) {
      b.classList.toggle("active", +b.dataset.n === n);
    });
    if (scrollRight) {
      var card = rightInner.querySelector('.card[data-n="' + n + '"]');
      if (card) {
        programmaticUntil = Date.now() + 1100;
        var top = card.getBoundingClientRect().top - right.getBoundingClientRect().top + right.scrollTop - 16;
        right.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      }
    }
    if (syncLeft) {
      var hot = page.querySelector('.hot[data-i="' + n + '"]');
      if (hot) {
        var r = hot.getBoundingClientRect(), box = pageScroll.getBoundingClientRect();
        if (r.top < box.top + 20 || r.bottom > box.bottom - 20) {
          pageScroll.scrollTo({
            top: pageScroll.scrollTop + r.top - box.top - pageScroll.clientHeight / 2,
            behavior: "smooth"
          });
        }
      }
    }
    paint();
  }
  function clearActive() {
    state.active = null; state.hover = null;
    document.querySelectorAll(".active,.dim").forEach(function (n) { n.classList.remove("active"); n.classList.remove("dim"); });
    paint();
  }

  /* ── 4. 连线 ── */
  var NS = "http://www.w3.org/2000/svg";
  var lineMap = {};
  function buildLines() {
    svg.innerHTML = "";
    lineMap = {};
    items.forEach(function (it) {
      var g = document.createElementNS(NS, "g");
      g.dataset.n = it.n;
      g.style.setProperty("--c", it.color);
      var p = document.createElementNS(NS, "path");
      p.setAttribute("class", "main");
      g.appendChild(p);
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("class", "dot");
      dot.setAttribute("r", 3.4);
      g.appendChild(dot);
      svg.appendChild(g);
      lineMap[it.n] = g;
    });
  }
  var raf = 0;
  function paint() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; draw(); }); }

  function draw() {
    var rr = right.getBoundingClientRect();
    var clipTop = rr.top + 14, clipBottom = rr.bottom - 14;
    var vw = window.innerWidth, vh = window.innerHeight;
    svg.setAttribute("viewBox", "0 0 " + vw + " " + vh);
    svg.setAttribute("width", vw);
    svg.setAttribute("height", vh);
    items.forEach(function (it) {
      var g = lineMap[it.n];
      if (!g) return;
      var hot = page.querySelector('.hot[data-i="' + it.n + '"]');
      var card = rightInner.querySelector('.card[data-n="' + it.n + '"]');
      if (!hot || !card) return;
      var hr = hot.getBoundingClientRect();
      var cr = card.getBoundingClientRect();
      var head = card.querySelector(".chead").getBoundingClientRect();
      var focused = state.active === it.n || state.hover === it.n;
      var visible = cr.bottom > clipTop && cr.top < clipBottom;
      if (!visible && !focused) { g.style.opacity = 0; return; }
      var sx = hr.right, sy = hr.top + hr.height / 2;
      var tx = head.left - 10;
      var ty = Math.max(clipTop, Math.min(clipBottom, head.top + head.height / 2));
      var clipped = !visible || head.top < clipTop || head.bottom > clipBottom;
      var c2 = tx - Math.max(26, (tx - sx) * .35);
      var d = "M" + sx + " " + sy + " C" + (sx + 40) + " " + sy + " " + c2 + " " + ty + " " + tx + " " + ty;
      g.querySelector(".main").setAttribute("d", d);
      var dot = g.querySelector(".dot");
      dot.setAttribute("cx", tx); dot.setAttribute("cy", ty);
      g.classList.toggle("clipped", clipped);
      g.classList.toggle("on", focused);
      g.style.opacity = (hr.right < 0 || hr.left > vw) ? 0 : 1;
    });
  }

  /* 右侧滚动时自动高亮左侧对应文字 */
  var syncTimer = 0;
  function syncFromScroll() {
    if (Date.now() < programmaticUntil) return;
    var top = right.getBoundingClientRect().top + 30;
    var best = null, bd = 1e9;
    document.querySelectorAll(".card").forEach(function (c) {
      var d = Math.abs(c.getBoundingClientRect().top - top);
      if (d < bd) { bd = d; best = +c.dataset.n; }
    });
    if (best && best !== state.active) activate(best, false, true);
  }

  /* ── 5. 图片大图 ── */
  var lb = document.getElementById("lb");
  var lbMedia = document.getElementById("lbMedia");
  var lbCap = document.getElementById("lbCap");
  var cur = 0;
  function openLightbox(i) {
    if (!images[i]) return;
    cur = i;
    var m = images[i];
    lbMedia.innerHTML = "";
    var img = document.createElement("img");
    img.src = enc(m.src);
    img.alt = m.label;
    lbMedia.appendChild(img);
    lbCap.textContent = m.label + (images.length > 1 ? "  ·  " + (i + 1) + " / " + images.length : "");
    lb.classList.add("open");
  }
  function step(d) {
    if (!images.length) return;
    openLightbox((cur + d + images.length) % images.length);
  }
  function closeLightbox() { lb.classList.remove("open"); lbMedia.innerHTML = ""; }
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbPrev").addEventListener("click", function () { step(-1); });
  document.getElementById("lbNext").addEventListener("click", function () { step(1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) closeLightbox(); });

  /* ── 6. 布局（固定适应宽度）与快捷键 ── */
  function layoutPage() {
    var box = pageScroll.getBoundingClientRect();
    var padR = parseFloat(getComputedStyle(pageScroll).paddingRight) || 0;
    var fitW = Math.max(140, box.width - padR - 6);
    page.style.width = fitW + "px";
    page.style.height = (fitW / RATIO) + "px";
    paint();
  }
  right.addEventListener("scroll", function () {
    paint();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncFromScroll, Math.max(130, programmaticUntil - Date.now() + 60));
  }, { passive: true });
  pageScroll.addEventListener("scroll", paint, { passive: true });
  window.addEventListener("resize", layoutPage, { passive: true });
  window.addEventListener("load", layoutPage);
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.closest && e.target.closest(".ctl,.player")) return;
    if (e.key === "Escape") { if (lb.classList.contains("open")) closeLightbox(); else clearActive(); return; }
    if (lb.classList.contains("open")) {
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
      return;
    }
  });

  /* ── 7. 启动 ── */
  buildLines();
  layoutPage();
  requestAnimationFrame(layoutPage);
  // 支持深链：作品集 PDF 里的「在线播放 …#item-9」
  function jumpFromHash() {
    var m = /^#item-(\d+)$/.exec(location.hash || "");
    if (!m) return;
    var n = parseInt(m[1], 10);
    setTimeout(function () {
      var card = rightInner.querySelector('.card[data-n="' + n + '"]');
      if (!card) return;
      programmaticUntil = Date.now() + 1200;
      var top = card.getBoundingClientRect().top - right.getBoundingClientRect().top + right.scrollTop - 16;
      right.scrollTop = Math.max(0, top);   // 直接定位：平滑滚动会被加载中的布局打断
      activate(n, false, true);
    }, 180);
  }
  window.addEventListener("hashchange", jumpFromHash);
  jumpFromHash();
  pageImg.addEventListener("load", layoutPage);
  document.body.dataset.ready = "1";
  document.body.dataset.items = String(items.length);
})();
</script>
</body>
</html>
